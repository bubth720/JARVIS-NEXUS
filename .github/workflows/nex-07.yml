name: NEX-07 isolated quota preflight
on:
  push:
    branches: ['feat/nex-07-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/check-prefusion.py
      - run: python3 -m unittest discover -s tests/prefusion -v
      - run: python3 tools/fusion-lab.py provision
      - run: python3 tools/prepare-services.py "$RUNNER_TEMP/nexus-services-source"
      - run: python3 tools/fusion-lab.py gradle -- -PservicesSource="$RUNNER_TEMP/nexus-services-source" test :nexus-cli:installDist :nexus-services-adapter:installDist --no-daemon --max-workers=2
      - run: python3 -m unittest discover -s tests/final -v
      - run: python3 -m unittest discover -s tests/zim -v
      - run: node --test tests/final/test_graph.cjs
      # tests/fusion02 lock the historical SHA and must be run at its original commit.
      # NEX-07 instead checks its exact new delta and runs all current JVM/Android suites.
  android-host:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/check-prefusion.py
      - run: python3 -m unittest discover -s tests/prefusion -v
      - run: python3 tools/fusion-lab.py --android provision
      - run: python3 tools/fusion-lab.py gradle -- -PwithAndroid=true :nexus-android-store:testDebugUnitTest :nexus-android-store:assembleDebug :nexus-android-store:assembleDebugAndroidTest :nexus-android-store:lintDebug --no-daemon --max-workers=2
      - run: python3 tools/fusion-lab.py api24
      - run: python3 tools/check-android-boundary.py
