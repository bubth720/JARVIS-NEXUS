name: NEX-07 isolated quota preflight
on:
  push:
    branches: ['feat/nex-07-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'mission/m50-integrated-beta-20261029' && github.head_ref == 'codex/m50-s1-nexus-ci-20261029' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the exact reviewed source scope
        env:
          M50_REVIEW: ${{ github.event_name == 'pull_request' && github.base_ref == 'mission/m50-integrated-beta-20261029' && github.head_ref == 'codex/m50-s1-nexus-ci-20261029' && github.event.pull_request.head.repo.full_name == github.repository }}
          LOT3_REVIEW: ${{ github.event_name == 'pull_request' && github.base_ref == 'mission/prefusion-lot3-20261027' && startsWith(github.head_ref, 'codex/prefusion-lot3-') }}
        run: |
          if [ "$M50_REVIEW" = "true" ]; then
            python3 tools/check-m50-s1.py
            python3 -m unittest discover -s tests/m50_s1 -v
          elif [ "$LOT3_REVIEW" = "true" ]; then
            python3 tools/check-prefusion-lot3.py
          else
            python3 tools/check-nexus00-scope.py
            python3 -m unittest discover -s tests/nexus00 -v
          fi
      - run: python3 -m unittest discover -s tests/prefusion -v
      - run: python3 tools/fusion-lab.py provision
      - run: python3 tools/prepare-services.py "$RUNNER_TEMP/nexus-services-source"
      - run: python3 tools/fusion-lab.py gradle -- -PservicesSource="$RUNNER_TEMP/nexus-services-source" test :nexus-cli:installDist :nexus-services-adapter:installDist --no-daemon --max-workers=2
      - run: python3 -m unittest discover -s tests/final -v
      - run: python3 -m unittest discover -s tests/zim -v
      - run: node --test tests/final/test_graph.cjs
      # tests/fusion02 lock the historical SHA and must be run at its original commit.
      # NEX-07 instead checks its exact new delta and runs all current JVM/Android suites.
  android-host:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'mission/m50-integrated-beta-20261029' && github.head_ref == 'codex/m50-s1-nexus-ci-20261029' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the exact reviewed source scope
        env:
          M50_REVIEW: ${{ github.event_name == 'pull_request' && github.base_ref == 'mission/m50-integrated-beta-20261029' && github.head_ref == 'codex/m50-s1-nexus-ci-20261029' && github.event.pull_request.head.repo.full_name == github.repository }}
          LOT3_REVIEW: ${{ github.event_name == 'pull_request' && github.base_ref == 'mission/prefusion-lot3-20261027' && startsWith(github.head_ref, 'codex/prefusion-lot3-') }}
        run: |
          if [ "$M50_REVIEW" = "true" ]; then
            python3 tools/check-m50-s1.py
            python3 -m unittest discover -s tests/m50_s1 -v
          elif [ "$LOT3_REVIEW" = "true" ]; then
            python3 tools/check-prefusion-lot3.py
          else
            python3 tools/check-nexus00-scope.py
            python3 -m unittest discover -s tests/nexus00 -v
          fi
      - run: python3 -m unittest discover -s tests/prefusion -v
      - run: python3 tools/fusion-lab.py --android provision
      - run: python3 tools/fusion-lab.py gradle -- -PwithAndroid=true :nexus-android-store:testDebugUnitTest :nexus-android-store:assembleDebug :nexus-android-store:assembleDebugAndroidTest :nexus-android-store:lintDebug --no-daemon --max-workers=2
      - run: python3 tools/fusion-lab.py api24
      - run: python3 tools/check-android-boundary.py
