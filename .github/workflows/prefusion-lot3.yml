name: NEX-PF-02 synthetic laboratory
on:
  push:
    branches: ['codex/prefusion-lot3-*']
  pull_request:
    branches: ['mission/prefusion-lot3-20261027']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/check-prefusion-lot3.py
      - run: python3 -m unittest discover -s tests/prefusion_lot3 -v
      - run: python3 -m unittest discover -s tests/prefusion -v
      - run: python3 tools/fusion-lab.py --android provision
      - run: python3 tools/prepare-services.py "$RUNNER_TEMP/services-source"
      - run: python3 tools/fusion-lab.py gradle -- -PservicesSource="$RUNNER_TEMP/services-source" test :nexus-cli:installDist :nexus-services-adapter:installDist --no-daemon --max-workers=2
      - run: python3 tools/fusion-lab.py gradle -- -PwithAndroid=true -PwithPrefusionLab=true :nexus-android-store:testDebugUnitTest :nexus-android-store:assembleDebug :nexus-android-store:assembleDebugAndroidTest :nexus-android-store:lintDebug :nexus-prefusion-lab:assembleDebugAndroidTest :nexus-prefusion-lab:lintDebug :nexus-prefusion-provider:assembleDebug :nexus-prefusion-provider:lintDebug --no-daemon --max-workers=2
      - run: python3 tools/check-android-boundary.py
      - run: python3 tools/fusion-lab.py api24
      - run: python3 -m unittest discover -s tests/final -v
      - run: python3 -m unittest discover -s tests/zim -v
      - run: node --test tests/final/test_graph.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-lot3-host
          path: |
            **/build/test-results/
            **/build/reports/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [24, 25, 26, 35]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: test -e /dev/kvm && sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          script: bash tools/run-prefusion-lot3-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-lot3-api-${{ matrix.api }}
          path: |
            nexus-android-store/build/outputs/androidTest-results/
            nexus-android-store/build/reports/androidTests/
            labs/android-lab/build/outputs/androidTest-results/
            labs/android-lab/build/reports/androidTests/
            labs/android-lab/build/reports/prefusion-lot3/
            lot3-platform-log.txt
