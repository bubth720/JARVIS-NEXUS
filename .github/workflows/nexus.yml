name: NEXUS JVM storage
on:
  push:
    branches: ['feat/nex-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned SERVICES parser sources (build time only)
        run: python3 tools/prepare-services.py "$RUNNER_TEMP/services-source"
      - run: ./gradlew -PservicesSource="$RUNNER_TEMP/services-source" test :nexus-cli:installDist :nexus-services-adapter:installDist --no-daemon
      - name: Synthetic demo in two independent processes
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/nexus-synthetic.db"
          nexus-cli/build/install/nexus-cli/bin/nexus-cli seed-demo "$db" > "$RUNNER_TEMP/nexus-seed.txt"
          nexus-cli/build/install/nexus-cli/bin/nexus-cli inspect "$db" > "$RUNNER_TEMP/nexus-reopen.txt"
          diff "$RUNNER_TEMP/nexus-seed.txt" "$RUNNER_TEMP/nexus-reopen.txt"
          cat "$RUNNER_TEMP/nexus-reopen.txt"
      - name: Encrypted synthetic backup and injected recovery failure
        run: nexus-cli/build/install/nexus-cli/bin/nexus-cli backup-demo "$RUNNER_TEMP"
